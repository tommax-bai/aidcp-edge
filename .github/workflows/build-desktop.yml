name: Build Desktop Installers

# Manually-triggered build of the AIDCP Edge desktop app.
#
# Why this exists: the macOS installer (dmg/zip) can ONLY be produced on a
# macOS machine (hdiutil / dmg tooling is mac-only), so it cannot be built on
# the Windows dev box. GitHub provides macOS runners, so this workflow builds
# mac (and Windows, for parity) in the cloud and hands back the installers.
#
# How to use:
#   1) Bump "version" in package.json first (the installers inherit it).
#   2) Actions tab -> "Build Desktop Installers" -> "Run workflow".
#   3) When it finishes, download the installers from the run page's Artifacts.
#
# macOS artifacts are signed with a Developer ID Application certificate and
# notarized with Apple notarytool. Required repository secrets:
#   MAC_CSC_LINK, MAC_CSC_KEY_PASSWORD,
#   APPLE_API_KEY_BASE64, APPLE_API_KEY_ID, APPLE_API_ISSUER, APPLE_TEAM_ID
#   ADS_RUNTIME_JSON_BASE64  (baked self-contained runtime key; gitignored locally)
#
# Inputs:
#   cloud_default_env  dev|ol — baked default cloud the app connects to out of the box.
#                      ol = production. Absent field => app falls back to its own dev default.
#   client_auth_url    optional http(s) /capi URL baked into the app. For ol builds,
#                      empty means https://aidcp.tommax.cc/capi.
#   include_windows    also build the Windows installer (not self-contained yet; off by default).

on:
  workflow_dispatch:
    inputs:
      cloud_default_env:
        description: 'Baked default cloud env (dev|ol). ol connects to production out of the box.'
        type: choice
        options:
          - dev
          - ol
        default: dev
      include_windows:
        description: 'Also build the Windows installer (unsigned, not self-contained yet).'
        type: boolean
        default: false
      client_auth_url:
        description: 'Optional client auth base URL to bake into mac app. Empty + ol => https://aidcp.tommax.cc/capi.'
        type: string
        default: ''
      update_url:
        description: 'OL automatic-update HTTPS base URL. Ignored for dev builds; do not use the cloud WebSocket URL.'
        type: string
        default: 'https://aidcp.oss-cn-beijing.aliyuncs.com/updates/ol/stable'

jobs:
  build-mac:
    name: macOS (dmg + zip, x64 + arm64)
    runs-on: macos-latest
    timeout-minutes: 360
    # contents:write lets the release-publish step below deliver the dmgs via a
    # GitHub Release (Release storage is separate from the Actions artifact quota).
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Check macOS signing secrets
        shell: bash
        run: |
          set -euo pipefail
          missing=0
          for name in CSC_LINK CSC_KEY_PASSWORD APPLE_API_KEY_BASE64 APPLE_API_KEY_ID APPLE_API_ISSUER APPLE_TEAM_ID; do
            if [ -z "${!name:-}" ]; then
              echo "$name is required" >&2
              missing=1
            fi
          done
          exit "$missing"
        env:
          CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          APPLE_API_KEY_BASE64: ${{ secrets.APPLE_API_KEY_BASE64 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      - name: Materialize Apple notarization key
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${APPLE_API_KEY_BASE64:-}" ]; then
            echo "APPLE_API_KEY_BASE64 is required for macOS notarization" >&2
            exit 1
          fi
          printf '%s' "$APPLE_API_KEY_BASE64" | base64 --decode > "$APPLE_API_KEY"
          chmod 600 "$APPLE_API_KEY"
        env:
          APPLE_API_KEY: ${{ runner.temp }}/AuthKey_${{ secrets.APPLE_API_KEY_ID }}.p8
          APPLE_API_KEY_BASE64: ${{ secrets.APPLE_API_KEY_BASE64 }}
      - name: Materialize self-contained runtime key
        # resources/ads-runtime.json (baked AdsPower key) is gitignored, so it is NOT in the
        # CI checkout. It IS referenced by build.extraResources and already ships inside every
        # distributed .app, so storing it as a repo secret is strictly more protected, not a new
        # exposure. Decode it here so the packaged app bundles the self-contained runtime.
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${ADS_RUNTIME_JSON_BASE64:-}" ]; then
            echo "ADS_RUNTIME_JSON_BASE64 is required to bundle the self-contained runtime" >&2
            exit 1
          fi
          mkdir -p resources
          printf '%s' "$ADS_RUNTIME_JSON_BASE64" | base64 --decode > resources/ads-runtime.json
          # Validate shape only; never print the key value.
          node -e "const j=require('./resources/ads-runtime.json'); if(!j || typeof j.adsApiKey!=='string' || !j.adsApiKey){console.error('ads-runtime.json missing adsApiKey');process.exit(1);} console.log('ads-runtime.json ok (version '+j.version+')')"
        env:
          ADS_RUNTIME_JSON_BASE64: ${{ secrets.ADS_RUNTIME_JSON_BASE64 }}
      - name: Resolve baked client auth URL
        shell: bash
        run: |
          set -euo pipefail
          auth_url="${{ inputs.client_auth_url }}"
          if [ -z "$auth_url" ] && [ "${{ inputs.cloud_default_env }}" = "ol" ]; then
            auth_url="https://aidcp.tommax.cc/capi"
          fi
          while [ -n "$auth_url" ] && [ "${auth_url%/}" != "$auth_url" ]; do
            auth_url="${auth_url%/}"
          done
          if [ -n "$auth_url" ]; then
            case "$auth_url" in
              http://*|https://*) ;;
              *) echo "client_auth_url must be http(s)://..." >&2; exit 2 ;;
            esac
            echo "AIDCP_CLIENT_AUTH_URL=$auth_url" >> "$GITHUB_ENV"
            echo "Client auth URL will be baked into the mac app."
          else
            echo "No client auth URL baked; login gate remains disabled by default."
          fi
      - name: Build signed and notarized macOS installers
        shell: bash
        # --publish never is enforced by scripts/build-desktop-macos.sh.
        timeout-minutes: 330
        run: scripts/build-desktop-macos.sh
        env:
          CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          APPLE_API_KEY: ${{ runner.temp }}/AuthKey_${{ secrets.APPLE_API_KEY_ID }}.p8
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          NOTARY_TIMEOUT_SECONDS: '7200'
          NOTARY_POLL_SECONDS: '30'
          # Bake the default cloud env chosen at dispatch (dev|ol) into this build.
          AIDCP_CLOUD_DEFAULT_ENV: ${{ inputs.cloud_default_env }}
          # Only the OL path consumes this; the build script rejects non-HTTPS values and keeps dev packages update-free.
          AIDCP_UPDATE_URL: ${{ inputs.update_url }}
      # Best-effort Actions artifact (kept lean). This can fail with "Artifact storage
      # quota has been hit" — that quota is recalculated only every 6-12h, so freeing space
      # does not immediately unblock it. The GitHub Release step below is the reliable
      # delivery channel, so this one is non-fatal.
      - name: Upload macOS artifacts (best-effort)
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: aidcp-macos
          if-no-files-found: error
          retention-days: 7
          path: |
            dist-electron/*.dmg
            dist-electron/*-mac.zip
            dist-electron/*-mac.zip.blockmap
            dist-electron/latest-mac.yml
      # Reliable delivery: publish the signed+notarized dmgs to a GitHub prerelease.
      # Release assets do NOT count against the Actions artifact storage quota.
      - name: Publish macOS release and update artifacts to GitHub prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          version=$(node -p "require('./package.json').version")
          tag="desktop-v${version}"
          echo "Publishing macOS release and update artifacts to prerelease $tag"
          # Recreate so re-runs replace assets cleanly.
          gh release delete "$tag" --yes --cleanup-tag 2>/dev/null || true
          gh release create "$tag" \
            --target "${GITHUB_SHA}" \
            --title "AIDCP Edge desktop ${version} (signed + notarized)" \
            --notes "Signed + notarized macOS build (OL builds also carry generic HTTPS update metadata). GitHub is a transfer channel; the client update feed is promoted from a separately verified static OL source." \
            --prerelease \
            dist-electron/*.dmg \
            dist-electron/*-mac.zip \
            dist-electron/*-mac.zip.blockmap \
            dist-electron/latest-mac.yml
          echo "Published assets:"
          gh release view "$tag" --json assets --jq '.assets[] | "  \(.name) \(.size)"'

  build-windows:
    name: Windows (nsis exe, x64)
    # Off by default: the Windows job does not yet stage the self-contained runtime
    # (build:ads-runtime / ads-runtime.json), so it would fail on missing extraResources.
    # Opt in only once Windows self-contained packaging is wired up.
    if: ${{ inputs.include_windows }}
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build Windows installer
        # --publish never: avoid electron-builder's CI auto-publish (needs GH_TOKEN).
        run: |
          npm run build:dist
          npx electron-builder --win --publish never
      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: aidcp-windows
          if-no-files-found: error
          retention-days: 14
          path: |
            dist-electron/*.exe
            dist-electron/*.blockmap
            dist-electron/latest.yml
