name: Build Desktop Installers

# Manually-triggered build of the AIDCP Edge desktop app.
#
# Why this exists: the macOS installer (dmg/zip) can ONLY be produced on a
# macOS machine (hdiutil / dmg tooling is mac-only), so it cannot be built on
# the Windows dev box. GitHub provides macOS runners, so this workflow builds
# mac (and Windows, for parity) in the cloud and hands back the installers.
#
# How to use:
#   1) Bump "version" in package.json first (the installers inherit it).
#   2) Actions tab -> "Build Desktop Installers" -> "Run workflow".
#   3) When it finishes, download the installers from the run page's Artifacts.
#
# macOS artifacts are signed with a Developer ID Application certificate and
# notarized with Apple notarytool. Required repository secrets:
#   MAC_CSC_LINK, MAC_CSC_KEY_PASSWORD,
#   APPLE_API_KEY_BASE64, APPLE_API_KEY_ID, APPLE_API_ISSUER, APPLE_TEAM_ID

on:
  workflow_dispatch:

jobs:
  build-mac:
    name: macOS (dmg + zip, x64 + arm64)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Check macOS signing secrets
        shell: bash
        run: |
          set -euo pipefail
          missing=0
          for name in CSC_LINK CSC_KEY_PASSWORD APPLE_API_KEY_BASE64 APPLE_API_KEY_ID APPLE_API_ISSUER APPLE_TEAM_ID; do
            if [ -z "${!name:-}" ]; then
              echo "$name is required" >&2
              missing=1
            fi
          done
          exit "$missing"
        env:
          CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          APPLE_API_KEY_BASE64: ${{ secrets.APPLE_API_KEY_BASE64 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      - name: Materialize Apple notarization key
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${APPLE_API_KEY_BASE64:-}" ]; then
            echo "APPLE_API_KEY_BASE64 is required for macOS notarization" >&2
            exit 1
          fi
          printf '%s' "$APPLE_API_KEY_BASE64" | base64 --decode > "$APPLE_API_KEY"
          chmod 600 "$APPLE_API_KEY"
        env:
          APPLE_API_KEY: ${{ runner.temp }}/AuthKey_${{ secrets.APPLE_API_KEY_ID }}.p8
          APPLE_API_KEY_BASE64: ${{ secrets.APPLE_API_KEY_BASE64 }}
      - name: Build macOS installers
        # --publish never: in CI electron-builder otherwise tries to publish to a
        # GitHub release and fails on a missing GH_TOKEN. We only want artifacts.
        run: |
          set -euo pipefail
          npm run build:dist
          npx electron-builder --mac --publish never
        env:
          CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          APPLE_API_KEY: ${{ runner.temp }}/AuthKey_${{ secrets.APPLE_API_KEY_ID }}.p8
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      - name: Notarize and staple DMGs
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          dmgs=(dist-electron/*.dmg)
          if [ "${#dmgs[@]}" -eq 0 ]; then
            echo "No DMG artifacts found" >&2
            exit 1
          fi
          for dmg in "${dmgs[@]}"; do
            echo "Notarizing $dmg"
            xcrun notarytool submit "$dmg" \
              --key "$APPLE_API_KEY" \
              --key-id "$APPLE_API_KEY_ID" \
              --issuer "$APPLE_API_ISSUER" \
              --wait
            xcrun stapler staple "$dmg"
          done
        env:
          APPLE_API_KEY: ${{ runner.temp }}/AuthKey_${{ secrets.APPLE_API_KEY_ID }}.p8
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
      - name: Verify macOS trust gates
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob

          apps=(dist-electron/mac*/AIDCP.app)
          if [ "${#apps[@]}" -eq 0 ]; then
            echo "No AIDCP.app bundles found" >&2
            exit 1
          fi
          for app in "${apps[@]}"; do
            echo "Verifying app bundle $app"
            codesign --verify --deep --strict --verbose=2 "$app"
            spctl --assess --verbose --type exec "$app"
            xcrun stapler validate "$app"
          done

          dmgs=(dist-electron/*.dmg)
          if [ "${#dmgs[@]}" -eq 0 ]; then
            echo "No DMG artifacts found" >&2
            exit 1
          fi
          for dmg in "${dmgs[@]}"; do
            echo "Verifying DMG $dmg"
            xcrun stapler validate "$dmg"
            spctl --assess --verbose --type open --context context:primary-signature "$dmg"
          done
      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: aidcp-macos
          if-no-files-found: error
          retention-days: 14
          path: |
            dist-electron/*.dmg
            dist-electron/*.zip
            dist-electron/*.blockmap
            dist-electron/latest-mac.yml

  build-windows:
    name: Windows (nsis exe, x64)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build Windows installer
        # --publish never: avoid electron-builder's CI auto-publish (needs GH_TOKEN).
        run: |
          npm run build:dist
          npx electron-builder --win --publish never
      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: aidcp-windows
          if-no-files-found: error
          retention-days: 14
          path: |
            dist-electron/*.exe
            dist-electron/*.blockmap
            dist-electron/latest.yml
