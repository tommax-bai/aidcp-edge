[package]
name = "aidcp-page-engine"
version = "0.1.0"
edition = "2024"
rust-version = "1.97.1"
publish = false

[dependencies]
futures-util = "0.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.52", features = ["io-std", "io-util", "macros", "net", "rt-multi-thread", "time"] }
tokio-tungstenite = "0.30"
url = "2.5"

[build-dependencies]
sha2 = "0.10"

[profile.release]
codegen-units = 1
lto = "thin"
panic = "abort"
strip = "symbols"
